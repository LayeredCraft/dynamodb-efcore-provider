tag-template: 'v$RESOLVED_VERSION'
filter-by-range: '>=11.0.0 <12.0.0'
# TEMPORARY (remove after v11.0.0 is published): the v11.0.0-preview seed is a GitHub
# prerelease and is the only EF11 baseline until v11.0.0 ships.
include-pre-releases: true
version-template: '11.$MINOR.$PATCH'
name-template: 'v$RESOLVED_VERSION (EF Core 11)'
commitish: main

version-resolver:
  minor:
    labels:
      - 'type: feat'
      - 'breaking-change'
  patch:
    labels:
      - 'type: fix'
      - 'type: docs'
      - 'type: refactor'
      - 'type: test'
      - 'type: chore'
      - 'type: ci'
      - 'type: revert'
  default: patch

autolabeler:
  - label: 'type: feat'
    title:
      - '/^feat(\(.+\))?(!)?:/i'
  - label: 'type: fix'
    title:
      - '/^fix(\(.+\))?(!)?:/i'
  - label: 'type: docs'
    title:
      - '/^docs(\(.+\))?(!)?:/i'
  - label: 'type: refactor'
    title:
      - '/^refactor(\(.+\))?(!)?:/i'
  - label: 'type: test'
    title:
      - '/^test(\(.+\))?(!)?:/i'
  - label: 'type: chore'
    title:
      - '/^chore(\(.+\))?(!)?:/i'
  - label: 'type: ci'
    title:
      - '/^ci(\(.+\))?(!)?:/i'
  - label: 'type: revert'
    title:
      - '/^revert(\(.+\))?(!)?:/i'
  - label: 'breaking-change'
    title:
      - '/^(feat|fix|docs|refactor|test|chore|ci|revert)(\([^)]*\))?!:/i'

categories:
  - title: '⚠️ Breaking Changes'
    labels:
      - 'breaking-change'
  - title: '🚀 Features'
    labels:
      - 'type: feat'
  - title: '🐛 Bug Fixes'
    labels:
      - 'type: fix'
  - title: '📚 Documentation'
    labels:
      - 'type: docs'
  - title: '🔄 Refactoring'
    labels:
      - 'type: refactor'
  - title: '✅ Tests'
    labels:
      - 'type: test'
  - title: '🔧 Maintenance'
    labels:
      - 'type: chore'
      - 'type: ci'
      - 'type: revert'

include-labels:
  - 'type: feat'
  - 'type: fix'
  - 'type: docs'
  - 'type: refactor'
  - 'type: test'
  - 'type: chore'
  - 'type: ci'
  - 'type: revert'
  - 'breaking-change'

exclude-labels:
  - 'skip-changelog'
  - 'internal'
  - 'ef10-only'

template: |
  ## Changes

  $CHANGES
