name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  autolabel:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Autolabel pull request
        uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: release-drafter-ef10.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  draft:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: read
    strategy:
      matrix:
        include:
          - config-name: release-drafter-ef10.yml
          - config-name: release-drafter-ef11.yml
    concurrency:
      group: release-drafter-${{ matrix.config-name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Draft ${{ matrix.config-name }} release
        uses: release-drafter/release-drafter@v7
        with:
          config-name: ${{ matrix.config-name }}
          disable_autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
