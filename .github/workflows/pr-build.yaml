name: PR Build

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  application-build:
    name: application build (${{ matrix.configuration }}, ${{ matrix.dotnetVersion }})
    permissions:
      id-token: write
      contents: write
    # Multi-version support: add a new matrix entry for the new EF version.
    # The release tag prefix (vN.*) drives configuration and SDK selection automatically
    # in publish-release.yaml via buildConfiguration: auto.
    # See docs/multi-version-ef-strategy.md for the full strategy.
    strategy:
      matrix:
        include:
          - configuration: "Debug EF10"
            dotnetVersion: "10.0.x"
          - configuration: "Debug EF11"
            dotnetVersion: "11.0.x"
    uses: LayeredCraft/devops-templates/.github/workflows/pr-build.yaml@7d587b6a23afca8815fd94a4a3d246857b3db08d
    with:
      solution: EntityFrameworkCore.DynamoDb.slnx
      hasTests: true
      useMtpRunner: true
      buildConfiguration: ${{ matrix.configuration }}
      dotnetVersion: ${{ matrix.dotnetVersion }}
      runCdk: false

  native-aot:
    name: native AOT smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish NativeAOT smoke app
        run: >-
          dotnet publish
          testapps/EntityFrameworkCore.DynamoDb.NativeAotSmoke/EntityFrameworkCore.DynamoDb.NativeAotSmoke.csproj
          --configuration Release
          --runtime linux-x64
          --output artifacts/nativeaot-smoke
      - name: Run NativeAOT smoke app
        run: ./artifacts/nativeaot-smoke/EntityFrameworkCore.DynamoDb.NativeAotSmoke

  build:
    name: build
    needs: [application-build, native-aot]
    if: ${{ always() }}
    uses: ./.github/workflows/required-build-check.yaml
    with:
      applicationBuildResult: ${{ needs.application-build.result }}
      nativeAotResult: ${{ needs.native-aot.result }}
