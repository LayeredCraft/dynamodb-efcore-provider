name: PR Build

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  application-build:
    name: application build (Debug)
    permissions:
      id-token: write
      contents: write
    # Standard multi-targeting (net10.0;net11.0): a single Debug build/test pass already
    # validates both EF lines, no per-EF matrix needed. See
    # docs/internal/ef11-native-aot-implementation-plan.md.
    uses: LayeredCraft/devops-templates/.github/workflows/pr-build.yaml@7d587b6a23afca8815fd94a4a3d246857b3db08d
    with:
      solution: EntityFrameworkCore.DynamoDb.slnx
      hasTests: true
      useMtpRunner: true
      buildConfiguration: Debug
      dotnetVersion: "11.0.x"
      runCdk: false

  native-aot:
    name: native AOT smoke (${{ matrix.targetFramework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetFramework: net10.0
            dotnetVersion: "10.0.x"
          - targetFramework: net11.0
            dotnetVersion: "11.0.x"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnetVersion }}
      - name: Write single-TFM override
        shell: bash
        run: scripts/write-target-framework-override.sh "${{ matrix.targetFramework }}"
      - name: Publish, gate, and run NativeAOT smoke
        shell: bash
        run: scripts/run-nativeaot-smoke.sh Release linux-x64 "${{ matrix.targetFramework }}"
      - name: Clear single-TFM override
        if: always()
        shell: bash
        run: scripts/write-target-framework-override.sh --clear

  aot-generation:
    name: AOT interceptor generation (${{ matrix.targetFramework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetFramework: net10.0
            dotnetVersion: "10.0.x"
          - targetFramework: net11.0
            dotnetVersion: "11.0.x"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnetVersion }}
      - run: dotnet restore tests/EntityFrameworkCore.DynamoDb.AotTests/EntityFrameworkCore.DynamoDb.AotTests.csproj -p:TargetFrameworks="${{ matrix.targetFramework }}"
      - run: dotnet build tests/EntityFrameworkCore.DynamoDb.AotTests/EntityFrameworkCore.DynamoDb.AotTests.csproj --configuration Debug --framework "${{ matrix.targetFramework }}" --no-restore
      - run: dotnet test tests/EntityFrameworkCore.DynamoDb.AotTests/EntityFrameworkCore.DynamoDb.AotTests.csproj --configuration Debug --framework "${{ matrix.targetFramework }}" --no-build

  build:
    name: build
    needs: [application-build, native-aot, aot-generation]
    if: ${{ always() }}
    uses: ./.github/workflows/required-build-check.yaml
    with:
      applicationBuildResult: ${{ needs.application-build.result }}
      nativeAotResult: ${{ needs.native-aot.result }}
      aotGenerationResult: ${{ needs.aot-generation.result }}
