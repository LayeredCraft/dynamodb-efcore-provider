name: PR Build

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  application-build:
    name: application build (${{ matrix.configuration }}, ${{ matrix.dotnetVersion }})
    permissions:
      id-token: write
      contents: write
    # Multi-version support: add a new matrix entry for the new EF version.
    # The release tag prefix (vN.*) drives configuration and SDK selection automatically
    # in publish-release.yaml via buildConfiguration: auto.
    # See docs/multi-version-ef-strategy.md for the full strategy.
    strategy:
      matrix:
        include:
          - configuration: "Debug EF10"
            dotnetVersion: "10.0.x"
          - configuration: "Debug EF11"
            dotnetVersion: "11.0.x"
    uses: LayeredCraft/devops-templates/.github/workflows/pr-build.yaml@7d587b6a23afca8815fd94a4a3d246857b3db08d
    with:
      solution: EntityFrameworkCore.DynamoDb.slnx
      hasTests: true
      useMtpRunner: true
      buildConfiguration: ${{ matrix.configuration }}
      dotnetVersion: ${{ matrix.dotnetVersion }}
      runCdk: false

  native-aot:
    name: native AOT smoke (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: "Release EF10"
            dotnetVersion: "10.0.x"
          - configuration: "Release EF11"
            dotnetVersion: "11.0.x"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnetVersion }}
      - name: Publish NativeAOT smoke app and capture warnings
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet publish \
            testapps/EntityFrameworkCore.DynamoDb.NativeAotSmoke/EntityFrameworkCore.DynamoDb.NativeAotSmoke.csproj \
            --configuration "${{ matrix.configuration }}" \
            --runtime linux-x64 \
            --output "artifacts/nativeaot-smoke" 2>&1 | tee "artifacts/nativeaot-smoke-${{ matrix.configuration }}.log"; then
            echo "NativeAOT publish failed."
            exit 1
          fi
          # Reviewed EF Core/AWS SDK reflection and dynamic-code warnings.
          baseline='IL2026 IL2055 IL2060 IL2067 IL2070 IL2072 IL2075 IL2091 IL2104 IL3050 IL3053'
          found=$(grep -oE 'warning IL[0-9]+' "artifacts/nativeaot-smoke-${{ matrix.configuration }}.log" | sort -u | awk '{print $2}' | sort || true)
          new=$(comm -23 <(printf '%s\n' "$found") <(printf '%s\n' "$baseline" | tr ' ' '\n' | sort))
          if [[ -n "$new" ]]; then
            echo "New NativeAOT warning IDs outside reviewed baseline: $new"
            exit 1
          fi
          echo "NativeAOT warning IDs match reviewed baseline: ${found:-none}"
      - name: Run NativeAOT smoke app
        run: ./artifacts/nativeaot-smoke/EntityFrameworkCore.DynamoDb.NativeAotSmoke

  aot-generation:
    name: AOT interceptor generation (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: "Debug EF10"
            dotnetVersion: "10.0.x"
          - configuration: "Debug EF11"
            dotnetVersion: "11.0.x"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnetVersion }}
      - run: dotnet restore tests/EntityFrameworkCore.DynamoDb.AotTests/EntityFrameworkCore.DynamoDb.AotTests.csproj -p:Configuration="${{ matrix.configuration }}"
      - run: dotnet build tests/EntityFrameworkCore.DynamoDb.AotTests/EntityFrameworkCore.DynamoDb.AotTests.csproj --configuration "${{ matrix.configuration }}" --no-restore
      - run: dotnet test tests/EntityFrameworkCore.DynamoDb.AotTests/EntityFrameworkCore.DynamoDb.AotTests.csproj --configuration "${{ matrix.configuration }}" --no-build

  build:
    name: build
    needs: [application-build, native-aot, aot-generation]
    if: ${{ always() }}
    uses: ./.github/workflows/required-build-check.yaml
    with:
      applicationBuildResult: ${{ needs.application-build.result }}
      nativeAotResult: ${{ needs.native-aot.result }}
      aotGenerationResult: ${{ needs.aot-generation.result }}
