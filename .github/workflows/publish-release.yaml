name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    uses: LayeredCraft/devops-templates/.github/workflows/publish-release.yml@7d587b6a23afca8815fd94a4a3d246857b3db08d
    with:
      solution: EntityFrameworkCore.DynamoDb.slnx
      dotnetVersion: "10.0.x"   # fallback only — overridden when buildConfiguration=auto
      buildConfiguration: auto
      hasTests: true

  push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: LayeredCraft/devops-templates/.github/actions/nuget-push@7d587b6a23afca8815fd94a4a3d246857b3db08d
        with:
          nuget_user: ${{ secrets.NUGET_USER }}
