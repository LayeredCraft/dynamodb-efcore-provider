name: Publish Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'mkdocs.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    # Multi-version support: add a new matrix entry for the new EF version.
    # See docs/internal/ef11-native-aot-implementation-plan.md for the full strategy.
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetFramework: net10.0
            dotnetVersion: "10.0.x"
            drafterConfig: "release-drafter-ef10.yml"
            artifact_name: "nuget-packages-ef10"
          - targetFramework: net11.0
            dotnetVersion: "11.0.x"
            drafterConfig: "release-drafter-ef11.yml"
            artifact_name: "nuget-packages-ef11"
    steps:
      - uses: actions/checkout@v7

      - name: Resolve next version via Release Drafter
        id: release-drafter
        uses: release-drafter/release-drafter@v7.7.0
        with:
          config-name: ${{ matrix.drafterConfig }}
          dry-run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve preview version
        id: version
        shell: bash
        run: |
          resolved="${{ steps.release-drafter.outputs.resolved_version }}"
          if [[ -z "$resolved" ]]; then
            echo "::error::Release Drafter returned an empty resolved_version. Ensure .github/${{ matrix.drafterConfig }} is configured correctly."
            exit 1
          fi
          base="${resolved%%-*}"
          package_version="${base}-preview.${{ github.run_number }}"
          printf 'package_version=%s\n' "$package_version" | tee -a "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnetVersion }}

      - name: Write single-TFM override
        run: scripts/write-target-framework-override.sh "${{ matrix.targetFramework }}"

      - name: Restore
        run: dotnet restore EntityFrameworkCore.DynamoDb.slnx

      - name: Build
        run: dotnet build EntityFrameworkCore.DynamoDb.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.package_version }}

      - name: Test
        run: dotnet test EntityFrameworkCore.DynamoDb.slnx --configuration Release --no-build

      - name: NativeAOT smoke validation
        run: scripts/run-nativeaot-smoke.sh Release linux-x64 "${{ matrix.targetFramework }}"

      - name: Pack
        run: dotnet pack src/EntityFrameworkCore.DynamoDb/EntityFrameworkCore.DynamoDb.csproj --configuration Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.package_version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/**/*.nupkg

      - name: Clear single-TFM override
        if: always()
        run: scripts/write-target-framework-override.sh --clear

  push:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: LayeredCraft/devops-templates/.github/actions/nuget-push@7d587b6a23afca8815fd94a4a3d246857b3db08d
        with:
          nuget_user: ${{ secrets.NUGET_USER }}
          artifact_name: "nuget-packages-ef*"
