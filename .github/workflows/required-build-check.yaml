name: Required Build Check

on:
  workflow_call:
    inputs:
      applicationBuildResult:
        description: "Aggregated result of the application build matrix."
        required: true
        type: string

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify application build
        run: |
          case "${{ inputs.applicationBuildResult }}" in
            success)
              echo "Application build matrix passed."
              ;;
            *)
              echo "::error::Application build matrix completed with result '${{ inputs.applicationBuildResult }}'."
              exit 1
              ;;
          esac
