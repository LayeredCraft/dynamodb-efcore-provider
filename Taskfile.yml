version: '3'

dotenv:
  - .env

vars:
  SOLUTION: EntityFrameworkCore.DynamoDb.slnx
  EF11_DOTNET_DIR: .dotnet/ef11

tasks:
  clean:
    desc: Clean build artifacts without requiring restored assets
    silent: true
    cmds:
      - echo "🧹 Cleaning build artifacts"
      - task: clean:packages
      - find . -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
      - echo "✅ Cleaning complete"

  clean:packages:
    desc: Clean local package output
    silent: true
    cmds:
      - '[ -d ./.nupkg ] && rm -r ./.nupkg || true'

  restore:
    desc: Restore dependencies for CONFIG (default Debug EF10)
    silent: true
    vars:
      CONFIG: '{{.CONFIG | default "Debug EF10"}}'
    cmds:
      - echo "📥 Restoring {{.CONFIG}}"
      - dotnet restore {{.SOLUTION}} -p:Configuration="{{.CONFIG}}"
      - echo "✅ Dependencies restored"

  build:
    desc: Build CONFIG (default Debug EF10). Example, task build CONFIG="Debug EF11"
    silent: true
    vars:
      CONFIG: '{{.CONFIG | default "Debug EF10"}}'
    cmds:
      - task: restore
        vars: { CONFIG: '{{.CONFIG}}' }
      - echo "🔨 Building {{.CONFIG}}"
      - dotnet build {{.SOLUTION}} --configuration "{{.CONFIG}}" --no-restore
      - echo "✅ {{.CONFIG}} build complete"

  build:ef10:
    desc: Build Debug EF10
    cmds:
      - task: build
        vars: { CONFIG: 'Debug EF10' }

  build:ef11:
    desc: Build Debug EF11 with installed/default dotnet SDK
    cmds:
      - task: build
        vars: { CONFIG: 'Debug EF11' }

  sdk:ef11:
    desc: Install CI-matching .NET 11 SDK into .dotnet/ef11
    silent: true
    cmds:
      - echo "📥 Installing .NET 11 SDK to {{.EF11_DOTNET_DIR}}"
      - mkdir -p {{.EF11_DOTNET_DIR}}
      - curl -sSL https://dot.net/v1/dotnet-install.sh -o {{.EF11_DOTNET_DIR}}/dotnet-install.sh
      - bash {{.EF11_DOTNET_DIR}}/dotnet-install.sh --channel 11.0 --install-dir {{.EF11_DOTNET_DIR}} --skip-non-versioned-files
      - '{{.EF11_DOTNET_DIR}}/dotnet --version'
      - echo "✅ .NET 11 SDK ready"

  build:ef11:ci-sdk:
    desc: Build Debug EF11 using .dotnet/ef11 SDK (runs sdk:ef11 first)
    deps: [ sdk:ef11 ]
    silent: true
    cmds:
      - echo "📥 Restoring Debug EF11 with CI-matching SDK"
      - DOTNET_ROOT={{.EF11_DOTNET_DIR}} PATH={{.EF11_DOTNET_DIR}}:$PATH dotnet restore {{.SOLUTION}} -p:Configuration="Debug EF11"
      - echo "🔨 Building Debug EF11 with CI-matching SDK"
      - DOTNET_ROOT={{.EF11_DOTNET_DIR}} PATH={{.EF11_DOTNET_DIR}}:$PATH dotnet build {{.SOLUTION}} --configuration "Debug EF11" --no-restore
      - echo "✅ Debug EF11 build complete"

  build:all:
    desc: Build Debug EF10 and Debug EF11
    cmds:
      - task: build:ef10
      - task: build:ef11

  test:
    desc: Test solution for CONFIG (default Debug EF10). Example, task test CONFIG="Debug EF11"
    silent: true
    vars:
      CONFIG: '{{.CONFIG | default "Debug EF10"}}'
    cmds:
      - task: build
        vars: { CONFIG: '{{.CONFIG}}' }
      - echo "🧪 Testing {{.CONFIG}}"
      - dotnet test {{.SOLUTION}} --configuration "{{.CONFIG}}" --no-build

  test:ef10:
    desc: Test Debug EF10
    cmds:
      - task: test
        vars: { CONFIG: 'Debug EF10' }

  test:ef11:
    desc: Test Debug EF11 with installed/default dotnet SDK
    cmds:
      - task: test
        vars: { CONFIG: 'Debug EF11' }

  test:unit:
    desc: Test unit project for CONFIG (default Debug EF10)
    silent: true
    vars:
      CONFIG: '{{.CONFIG | default "Debug EF10"}}'
    cmds:
      - task: build
        vars: { CONFIG: '{{.CONFIG}}' }
      - dotnet test tests/EntityFrameworkCore.DynamoDb.Tests/EntityFrameworkCore.DynamoDb.Tests.csproj --configuration "{{.CONFIG}}" --no-build

  test:aot-generation:
    desc: Compile generated query interceptors for CONFIG (default Debug EF10)
    silent: true
    vars:
      CONFIG: '{{.CONFIG | default "Debug EF10"}}'
    cmds:
      - dotnet restore tests/EntityFrameworkCore.DynamoDb.AotTests/EntityFrameworkCore.DynamoDb.AotTests.csproj -p:Configuration="{{.CONFIG}}"
      - dotnet build tests/EntityFrameworkCore.DynamoDb.AotTests/EntityFrameworkCore.DynamoDb.AotTests.csproj --configuration "{{.CONFIG}}" --no-restore
      - dotnet test tests/EntityFrameworkCore.DynamoDb.AotTests/EntityFrameworkCore.DynamoDb.AotTests.csproj --configuration "{{.CONFIG}}" --no-build

  test:aot-publish:
    desc: Publish and run NativeAOT smoke app for CONFIG (default Release EF10)
    silent: true
    dir: testapps/EntityFrameworkCore.DynamoDb.NativeAotSmoke
    vars:
      CONFIG: '{{.CONFIG | default "Release EF10"}}'
      RID:
        sh: 'os=$(uname -s); arch=$(uname -m); case "$os" in Darwin) rid="osx";; Linux) rid="linux";; *) echo "Unsupported OS for AOT tasks: $os" >&2; exit 1;; esac; case "$arch" in arm64|aarch64) rid="$rid-arm64";; x86_64) rid="$rid-x64";; *) echo "Unsupported architecture: $arch" >&2; exit 1;; esac; echo "$rid"'
      OUTPUT: '{{.ROOT_DIR}}/artifacts/nativeaot-smoke'
    cmds:
      - dotnet restore EntityFrameworkCore.DynamoDb.NativeAotSmoke.csproj -p:Configuration="{{.CONFIG}}" --runtime {{.RID}}
      - dotnet publish EntityFrameworkCore.DynamoDb.NativeAotSmoke.csproj --configuration "{{.CONFIG}}" --runtime {{.RID}} --no-restore --output {{.OUTPUT}}
      - '{{.OUTPUT}}/EntityFrameworkCore.DynamoDb.NativeAotSmoke'

  test:aot-warnings:
    desc: Fail if the NativeAOT smoke publish reports AOT warning IDs outside the pinned baseline
    silent: true
    dir: testapps/EntityFrameworkCore.DynamoDb.NativeAotSmoke
    vars:
      CONFIG: '{{.CONFIG | default "Release EF10"}}'
      RID:
        sh: 'os=$(uname -s); arch=$(uname -m); case "$os" in Darwin) rid="osx";; Linux) rid="linux";; *) echo "Unsupported OS for AOT tasks: $os" >&2; exit 1;; esac; case "$arch" in arm64|aarch64) rid="$rid-arm64";; x86_64) rid="$rid-x64";; *) echo "Unsupported architecture: $arch" >&2; exit 1;; esac; echo "$rid"'
      OUTPUT: '{{.ROOT_DIR}}/artifacts/nativeaot-smoke-warnings'
      # Baseline AOT trimmer/AOT-compiler warning IDs observed with the pinned EF/SDK/ILCompiler
      # versions. New warning IDs mean new reflection/dynamic surface (often provider code) and
      # must be reviewed and either fixed or consciously added here. Occurrence counts are not
      # pinned because MSBuild output duplication makes them non-deterministic.
      BASELINE: 'IL2026 IL2055 IL2060 IL2067 IL2070 IL2072 IL2075 IL2091 IL2104 IL3050 IL3053'
    cmds:
      - dotnet restore EntityFrameworkCore.DynamoDb.NativeAotSmoke.csproj -p:Configuration="{{.CONFIG}}" --runtime {{.RID}}
      - |
        set -o pipefail
        if ! dotnet publish EntityFrameworkCore.DynamoDb.NativeAotSmoke.csproj --configuration "{{.CONFIG}}" --runtime {{.RID}} --no-restore --output {{.OUTPUT}} 2>&1 | tee {{.OUTPUT}}.log; then
          echo "NativeAOT publish failed."
          exit 1
        fi
        # Reviewed EF Core/AWS SDK reflection and dynamic-code warnings.
        FOUND=$(grep -oE 'warning IL[0-9]+' {{.OUTPUT}}.log | sort -u | awk '{print $2}' | sort || true)
        NEW=$(comm -23 <(echo "$FOUND") <(echo "{{.BASELINE}}" | tr ' ' '\n' | sort))
        if [ -n "$NEW" ]; then
          echo "New AOT warning IDs outside the pinned baseline: $NEW"
          echo "Review the new AOT-unsafe surface, then fix it or update BASELINE in Taskfile.yml."
          exit 1
        fi
        echo "AOT warnings match the pinned baseline: $(echo $FOUND | tr '\n' ' ')"

  test:spec:
    desc: Test specification project for CONFIG (default Debug EF10). Optional FILTER="..."
    silent: true
    vars:
      CONFIG: '{{.CONFIG | default "Debug EF10"}}'
      FILTER: '{{.FILTER | default ""}}'
    cmds:
      - task: build
        vars: { CONFIG: '{{.CONFIG}}' }
      - echo "🧪 Testing spec {{.CONFIG}}{{if .FILTER}} filter={{.FILTER}}{{end}}"
      - '{{if .FILTER}}dotnet test tests/EntityFrameworkCore.DynamoDb.SpecificationTests/EntityFrameworkCore.DynamoDb.SpecificationTests.csproj --configuration "{{.CONFIG}}" --no-build --filter "{{.FILTER}}"{{else}}dotnet test tests/EntityFrameworkCore.DynamoDb.SpecificationTests/EntityFrameworkCore.DynamoDb.SpecificationTests.csproj --configuration "{{.CONFIG}}" --no-build{{end}}'

  test:spec:ef10:
    desc: Test specification project against Debug EF10. Optional FILTER="..."
    cmds:
      - task: test:spec
        vars: { CONFIG: 'Debug EF10', FILTER: '{{.FILTER | default ""}}' }

  test:spec:ef11:
    desc: Test specification project against Debug EF11. Optional FILTER="..."
    cmds:
      - task: test:spec
        vars: { CONFIG: 'Debug EF11', FILTER: '{{.FILTER | default ""}}' }

  test:spec:all:
    desc: Test specification project against Debug EF10 and Debug EF11. Optional FILTER="..."
    cmds:
      - task: test:spec:ef10
        vars: { FILTER: '{{.FILTER | default ""}}' }
      - task: test:spec:ef11
        vars: { FILTER: '{{.FILTER | default ""}}' }

  pack:
    desc: Pack CONFIG (default Release EF10). Example, task pack CONFIG="Release EF11"
    silent: true
    vars:
      CONFIG: '{{.CONFIG | default "Release EF10"}}'
    cmds:
      - echo "📦 Packing {{.CONFIG}}"
      - dotnet restore {{.SOLUTION}} -p:Configuration="{{.CONFIG}}"
      - dotnet pack src/EntityFrameworkCore.DynamoDb/EntityFrameworkCore.DynamoDb.csproj --configuration "{{.CONFIG}}" --no-restore --output ./.nupkg
      - echo "✅ Packed {{.CONFIG}}"

  pack:ef10:
    desc: Pack Release EF10
    cmds:
      - task: pack
        vars: { CONFIG: 'Release EF10' }

  pack:ef11:
    desc: Pack Release EF11
    cmds:
      - task: pack
        vars: { CONFIG: 'Release EF11' }

  publish:
    desc: Pack EF10/EF11 from a clean package output and publish to NuGet
    silent: true
    cmds:
      - echo "🚀 Publishing"
      - task: clean:packages
      - task: pack:ef10
      - task: pack:ef11
      - dotnet nuget push ./.nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key $NUGET_API_KEY_LOCAL --skip-duplicate
      - echo "✨ Published"

  docs:serve:
    desc: Serve docs locally with Zensical
    silent: true
    cmds:
      - echo "📖 Serving Docs"
      - uv run zensical serve -f zensical.toml

  docs:build:
    desc: Build docs site with Zensical
    silent: true
    cmds:
      - echo "📖 Building Docs"
      - uv run zensical build -f zensical.toml
      - echo "✅ Docs built"
